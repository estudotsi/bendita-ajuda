<div class="loc">
  <p class="loc__chip">
    <svg lucideIcon="map-pin" [size]="22" />
    @if (label(); as place) {
      <span>Perto de você — <strong>{{ place }}</strong></span>
    } @else {
      <span>Mostrando o Brasil todo</span>
    }
  </p>
  <button
    type="button"
    class="btn btn--link"
    [attr.aria-label]="isChoosing() ? 'Fechar' : location() ? 'Trocar o local' : 'Informar meu CEP'"
    aria-controls="informar-cep"
    [attr.aria-expanded]="isChoosing()"
    (click)="toggle()"
  >
    {{ isChoosing() ? 'fechar' : location() ? 'trocar' : 'informar meu CEP' }}
  </button>
</div>

@if (isChoosing()) {
  <form id="informar-cep" class="panel" (submit)="confirm($event)">
    <label for="cep-cliente" class="panel__title">Qual o seu CEP? Assim mostramos quem está perto.</label>
    <div class="panel__row">
      <input
        id="cep-cliente"
        class="field-input"
        type="text"
        inputmode="numeric"
        autocomplete="postal-code"
        placeholder="00000-000"
        [value]="cep()"
        [attr.aria-invalid]="!!error()"
        aria-describedby="erro-cep"
        (input)="onCepInput($event)"
      />
      <button type="submit" class="btn btn--primary" [disabled]="busy()">
        @if (busy()) {
          <svg lucideIcon="loader-circle" [size]="22" class="spin" />
        } @else {
          <svg lucideIcon="check" [size]="22" />
        }
        Pronto
      </button>
    </div>
    <p id="erro-cep" class="field-error" role="alert">{{ error() }}</p>
  </form>
}
