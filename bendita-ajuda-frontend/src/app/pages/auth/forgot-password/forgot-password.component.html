<main class="auth-page">
  <section class="auth-card">
    <a routerLink="/login" class="auth-back">Voltar para login</a>
    <span class="auth-eyebrow">Senha</span>
    <h1>Esqueci minha senha</h1>
    <p>Informe seu e-mail para receber as instrucoes de redefinicao de senha.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <label>
        E-mail
        <input type="email" formControlName="email" autocomplete="email" placeholder="voce@email.com" />
      </label>

      @if (error) {
        <div class="form-message form-message--error">{{ error }}</div>
      }

      @if (feedback) {
        <div class="form-message form-message--success">{{ feedback }}</div>
      }

      <button class="auth-submit" type="submit">Enviar instrucoes</button>
    </form>
  </section>
</main>
