<main class="auth-page">
  <section class="auth-card">
    <a routerLink="/" class="auth-back">Voltar para inicio</a>
    <span class="auth-eyebrow">Acesso</span>
    <h1>Entrar na conta</h1>
    <p>Use seu e-mail e senha para acessar sua area no Bendita Ajuda.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <label>
        E-mail
        <input type="email" formControlName="email" autocomplete="email" placeholder="voce@email.com" />
      </label>

      <label>
        Senha
        <span class="password-field">
          <input
            [type]="showPassword ? 'text' : 'password'"
            formControlName="senha"
            autocomplete="current-password"
            placeholder="Sua senha"
          />
          <button
            type="button"
            class="password-toggle"
            [attr.aria-label]="showPassword ? 'Ocultar senha' : 'Mostrar senha'"
            (click)="togglePasswordVisibility()"
          >
            <span class="password-toggle__icon" [class.password-toggle__icon--off]="showPassword"></span>
          </button>
        </span>
      </label>

      @if (error) {
        <div class="form-message form-message--error">{{ error }}</div>
      }

      @if (feedback) {
        <div class="form-message form-message--success">{{ feedback }}</div>
      }

      <button class="auth-submit" type="submit">Entrar</button>
    </form>

    <div class="auth-divider">
      <span>ou</span>
    </div>

    <div class="google-login">
      <div #googleButton class="google-login__button"></div>
      @if (isGoogleLoading) {
        <span class="google-login__status">Entrando com Google...</span>
      }
    </div>

    <div class="auth-links">
      <a routerLink="/forgot-password">Esqueci minha senha</a>
      <a routerLink="/register">Criar conta de usuario</a>
      <a routerLink="/register-prestador">Quero ser prestador</a>
    </div>
  </section>
</main>
