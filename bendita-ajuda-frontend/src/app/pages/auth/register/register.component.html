<main class="auth-page">
  <section class="auth-card">
    <a routerLink="/" class="auth-back">Voltar para inicio</a>
    <span class="auth-eyebrow">Cliente</span>
    <h1>Criar conta de usuario</h1>
    <p>Cadastre-se para encontrar profissionais, solicitar servicos e acompanhar pedidos.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <label>
        Nome
        <input type="text" formControlName="nome" autocomplete="name" placeholder="Seu nome" />
      </label>

      <label>
        E-mail
        <input type="email" formControlName="email" autocomplete="email" placeholder="voce@email.com" />
      </label>

      <label>
        Senha
        <span class="password-field">
          <input
            [type]="showPassword ? 'text' : 'password'"
            formControlName="senha"
            autocomplete="new-password"
            placeholder="Minimo de 6 caracteres"
          />
          <button
            type="button"
            class="password-toggle"
            [attr.aria-label]="showPassword ? 'Ocultar senha' : 'Mostrar senha'"
            (click)="togglePasswordVisibility()"
          >
            <span class="password-toggle__icon" [class.password-toggle__icon--off]="showPassword"></span>
          </button>
        </span>
      </label>

      @if (error) {
        <div class="form-message form-message--error">{{ error }}</div>
      }

      @if (feedback) {
        <div class="form-message form-message--success">{{ feedback }}</div>
      }

      <button class="auth-submit" type="submit">Criar conta</button>
    </form>

    <div class="auth-links">
      <a routerLink="/login">Ja tenho conta</a>
      <a routerLink="/register-prestador">Cadastrar como prestador</a>
    </div>
  </section>
</main>
