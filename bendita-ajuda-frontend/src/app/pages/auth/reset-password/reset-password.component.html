<main class="auth-page">
  <section class="auth-card">
    <a routerLink="/login" class="auth-back">Voltar para login</a>
    <span class="auth-eyebrow">Senha</span>
    <h1>Resetar senha</h1>
    <p>Digite sua nova senha para concluir a recuperacao da conta.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <label>
        E-mail
        <input type="email" formControlName="email" autocomplete="email" readonly />
      </label>

      <label>
        Nova senha
        <span class="password-field">
          <input
            [type]="showPassword ? 'text' : 'password'"
            formControlName="novaSenha"
            autocomplete="new-password"
            placeholder="Minimo de 6 caracteres"
          />
          <button
            type="button"
            class="password-toggle"
            [attr.aria-label]="showPassword ? 'Ocultar senha' : 'Mostrar senha'"
            (click)="togglePasswordVisibility()"
          >
            <span class="password-toggle__icon" [class.password-toggle__icon--off]="showPassword"></span>
          </button>
        </span>
      </label>

      @if (error) {
        <div class="form-message form-message--error">{{ error }}</div>
      }

      @if (feedback) {
        <div class="form-message form-message--success">{{ feedback }}</div>
        <a routerLink="/login" class="auth-submit auth-submit--link">Ir para login</a>
      } @else {
        <button class="auth-submit" type="submit">Redefinir senha</button>
      }
    </form>
  </section>
</main>
