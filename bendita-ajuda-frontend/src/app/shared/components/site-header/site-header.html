<header class="header">
  <div class="container header__inner">
    <a routerLink="/" class="brand" aria-label="Bendita Ajuda, voltar para o início">
      <span class="brand__icon"><svg lucideIcon="hand-helping" [size]="26" /></span>
      <span class="brand__name">Bendita Ajuda</span>
    </a>

    @if (auth.isLoggedIn()) {
      <div class="account">
        <div class="account__who">
          <span class="account__hello">Olá, {{ firstName() }}</span>
          @if (auth.isAdmin()) {
            <a routerLink="/admin" class="badge badge--admin" aria-label="Admin: ver serviços sugeridos">
              <svg lucideIcon="shield-check" [size]="16" /> Admin
            </a>
          }
          @if (auth.user()?.ehPrestador) {
            <a routerLink="/seja-prestador" class="badge" aria-label="Prestador: ver meu cadastro">
              <svg lucideIcon="hand-helping" [size]="16" /> Prestador
            </a>
          }
        </div>
        <button type="button" class="btn btn--outline" aria-label="Sair da sua conta" (click)="auth.logout()">
          <svg lucideIcon="log-out" [size]="22" />
          Sair
        </button>
      </div>
    } @else if (auth.isChecked()) {
      <a routerLink="/entrar" class="btn btn--outline" aria-label="Entrar na sua conta">
        <svg lucideIcon="log-in" [size]="22" />
        Entrar
      </a>
    }
  </div>
</header>
